<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>অ্যাডমিন | সাজিনাস হসপিটাল</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css">
<style>
body{background:linear-gradient(160deg,#eef4fa,#e3eefb 60%,#e8f7ec);min-height:100vh;font-size:17px}
.wrap{max-width:1040px;margin:0 auto;padding:20px}.box{background:#fff;border-radius:20px;padding:22px;margin-bottom:16px;border:1px solid var(--line);box-shadow:0 12px 30px rgba(18,48,111,.07)}
.box h2,.box h3{color:var(--navy);margin:6px 0 12px}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button{flex:1 1 130px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row>*{flex:1 1 150px}
input,select,textarea{padding:11px 12px;border:1px solid #bccbdd;border-radius:10px;font:inherit;width:100%;margin:4px 0;background:#fff}input[type=checkbox]{width:auto;margin-right:6px}input[type=color]{padding:2px;height:42px}
label.fl2{display:block;font-weight:600;font-size:15.5px;color:#26406f;margin-top:8px}.s{font-size:15px;color:#4a5d80}.badge{background:var(--red);color:#fff;border-radius:99px;padding:0 8px;margin-left:6px;font-size:14px}.new{background:#fff7d6}
.lgt{display:flex;gap:8px;margin:10px 0 14px}.lgt button{flex:1}
.st{display:inline-block;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:600}.st.active{background:#dff3e5;color:#1a7434}.st.pending{background:#fff1c9;color:#8a5a00}.st.disabled{background:#fde1df;color:#a3231b}
details.g{border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#fbfdff;overflow:hidden}details.g>summary{cursor:pointer;padding:14px 18px;font:700 19px 'Anek Bangla';color:var(--navy);background:#eef4fa;list-style:none}details.g>summary::before{content:"▸ ";transition:rotate .2s;display:inline-block}details.g[open]>summary::before{rotate:90deg}
.gi{padding:6px 18px 16px}.it{border:1px dashed #b9c9de;border-radius:14px;padding:6px 14px 12px;margin:12px 0;background:#fff}.it>.ih{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ih b{color:var(--navy)}.ih .btn{padding:5px 12px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.thumb{display:flex;gap:12px;align-items:center;margin-top:6px}.thumb img{width:96px;height:64px;object-fit:cover;border-radius:10px;background:var(--sky);border:1px solid var(--line)}
.savebar{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:14px;z-index:5}
.err{color:#a3231b;font-weight:600}.ok2{color:#1a7434;font-weight:600}
.thumb input[type=file]{width:auto;flex:1;border:0;padding:4px 0}.thumb .s{width:96px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="box" id="lg"><img src="assets/img/logo.png" height="46" alt="">
<div class="lgt"><button class="btn pri" data-m="in" type="button">লগইন</button><button class="btn ghost" data-m="up" type="button">সাইন আপ</button></div>
<form id="lf"><h2>স্টাফ লগইন</h2><input name="username" placeholder="ইউজারনেম বা ইমেইল" autocomplete="username" required><input name="password" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required><button class="btn pri">লগইন</button></form>
<form id="sf" hidden><h2>নতুন স্টাফ সাইন আপ</h2><input name="name" placeholder="আপনার নাম" autocomplete="name" required maxlength="80"><input name="email" type="email" placeholder="ইমেইল আইডি" autocomplete="email" required><input name="mobile" inputmode="numeric" pattern="01[0-9]{9}" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" autocomplete="tel" required><input name="password" type="password" minlength="8" placeholder="পাসওয়ার্ড (৮+ অক্ষর)" autocomplete="new-password" required><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button class="btn pri">সাইন আপ করুন</button></form>
<p class="s" id="lmsg">শুধু হসপিটালের অনুমোদিত স্টাফের জন্য। সাইন আপের পর মূল অ্যাডমিন অনুমোদন দিলে লগইন করা যাবে।</p></div>
<div id="app" hidden><div class="box"><div class="row"><b id="who"></b><a class="btn ghost" href="index.html" target="_blank" rel="noopener">সাইট দেখুন</a><button class="btn ghost" id="out">লগআউট</button></div>
<div class="tabs"><button class="btn pri" data-t="b">বুকিং<span class="badge" id="nb" hidden>0</span></button><button class="btn ghost" data-t="d">ডাক্তার</button><button class="btn ghost" data-t="c">সাইট কনটেন্ট</button><button class="btn ghost" data-t="a" id="tabA">ফার্মাসিস্ট</button><button class="btn ghost" data-t="u">স্টাফ ইউজার<span class="badge" id="nu" hidden>0</span></button></div><div id="v"></div></div></div></div><div id="toast"></div>
<script src="assets/js/config.js"></script><script src="assets/js/site-data.js"></script><script src="assets/js/doctors-data.js"></script><script src="assets/js/admin.js"></script></body></html>
