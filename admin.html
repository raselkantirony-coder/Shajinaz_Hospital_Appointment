<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>অ্যাডমিন | শাজিনাজ হাসপাতাল</title>

<style>body{background:var(--mist)}.wrap{max-width:1000px;margin:0 auto;padding:20px}.box{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--line)}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row>*{flex:1 1 140px}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;width:100%;margin:4px 0}.s{font-size:14px;opacity:.75}.badge{background:var(--red);color:#fff;border-radius:99px;padding:0 8px;margin-left:6px}.new{background:#fff7d6}</style></head><body><div class="wrap">
